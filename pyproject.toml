[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[project]
name = "fastapi_template"
description = "FastAPI template"
version = "0.0.1"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E.*"]
keywords = ["fastapi", "template"]
authors = [
    {name = "jordan95v", email = "90615280+jordan95v@users.noreply.github.com"},
]
maintainers = [
    {name = "jordan95v", email = "90615280+jordan95v@users.noreply.github.com"}
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "alembic",
    "fastapi[standard]",
    "sqlmodel",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-env",
    "pytest-mock",
    "python-dotenv",
]
mail = [
    "fastapi-mail",
]

[tool.pytest.ini_options]
addopts = "-vv --tb=short --cov=core --cov-report=term-missing"
env = [
    "DATABASE_URI=sqlite:///:memory:",
]

[tool.coverage.run]
omit = [
    "**/__init__.py",
    "**/tests/*",
]